<!DOCTYPE html>
<html lang="vi" class="dark" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI GIẢI BÀI – Trợ lý giảng bài & giải bài từng bước</title>

<!-- ============================================================
     EduAI Pro – AI Teaching Assistant & Step-by-Step Solver
     Single file: Tailwind (CDN) + Marked + DOMPurify + KaTeX + JSXGraph
     ============================================================ -->

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Be Vietnam Pro', 'system-ui', 'sans-serif'] } } } };
</script>
<!-- Fonts & icons -->
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<!-- KaTeX (math) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<!-- JSXGraph (geometry) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraph.css" />
<script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.9.2/distrib/jsxgraphcore.js"></script>
<!-- Markdown + sanitizer -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>

<style>
  /* ================= THEME TOKENS ================= */
  :root, html[data-theme="dark"] {
    --bg:#0f172a; --bg2:#0b1120; --side:rgba(11,17,32,.72);
    --panel:rgba(255,255,255,.05); --panel-strong:rgba(255,255,255,.09);
    --text:#e8edf7; --muted:#8e9bb8; --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.18);
    --code:rgba(0,0,0,.32); --composer:rgba(21,29,50,.86);
    --board:#0b1224; --board-line:#7aa7ff; --board-text:#e8edf7; --grid:rgba(148,163,184,.16);
    --shadow:0 24px 60px -24px rgba(0,0,0,.7); --orb:.30;
    --grad:linear-gradient(135deg,#4f8dff 0%,#9b6dff 52%,#ff6fb1 100%);
    --rainbow:linear-gradient(90deg,#4285f4,#9b72cb,#d96570,#f5a623,#34a853,#4285f4);
  }
  html[data-theme="light"] {
    --bg:#f4f6fc; --bg2:#e9eefa; --side:rgba(255,255,255,.72);
    --panel:rgba(255,255,255,.75); --panel-strong:#ffffff;
    --text:#101828; --muted:#667085; --border:rgba(16,24,40,.09); --border-strong:rgba(16,24,40,.18);
    --code:rgba(16,24,40,.06); --composer:rgba(255,255,255,.94);
    --board:#ffffff; --board-line:#2563eb; --board-text:#101828; --grid:rgba(16,24,40,.08);
    --shadow:0 24px 60px -28px rgba(40,50,110,.35); --orb:.20;
  }
  *, *::before, *::after { -webkit-tap-highlight-color: transparent; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:'Be Vietnam Pro', system-ui, sans-serif; overflow:hidden; -webkit-font-smoothing:antialiased; }
  button { font-family:inherit; }
  textarea, input { font-family:inherit; }
  textarea { resize:none; } textarea:focus, input:focus { outline:none; }
  ::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:rgba(148,163,184,.3); border-radius:8px; } ::-webkit-scrollbar-thumb:hover { background:rgba(148,163,184,.5); }

  /* ================= BACKGROUND ================= */
  .bg-layer { position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  .orb { position:absolute; border-radius:50%; filter:blur(110px); opacity:var(--orb); animation:drift 26s ease-in-out infinite alternate; }
  .o1 { width:52vmax; height:52vmax; background:#3b7bff; top:-22%; left:-14%; }
  .o2 { width:44vmax; height:44vmax; background:#a259ff; top:20%; right:-18%; animation-delay:-9s; }
  .o3 { width:40vmax; height:40vmax; background:#ff5fa2; bottom:-26%; left:28%; animation-delay:-16s; opacity:calc(var(--orb) * .7); }
  .grid-dots { position:absolute; inset:0; background-image:radial-gradient(var(--border-strong) 1px, transparent 1px); background-size:28px 28px; opacity:.5;
    -webkit-mask-image:radial-gradient(ellipse at 55% 25%, #000 10%, transparent 70%); mask-image:radial-gradient(ellipse at 55% 25%, #000 10%, transparent 70%); }
  @keyframes drift { to { transform:translate3d(7vmax,-5vmax,0) scale(1.12); } }

  /* ================= SHARED EFFECTS ================= */
  .glass { background:var(--panel); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border:1px solid var(--border); }
  .glass-strong { background:var(--panel-strong); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); border:1px solid var(--border); }
  .rainbow-text, .shimmer { background:var(--rainbow); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:flow 7s linear infinite; }
  .shimmer { animation-duration:2.2s; }
  @keyframes flow { to { background-position:300% 0; } }
  .aurora-border { position:relative; border-radius:1.5rem; }
  .aurora-border::before { content:""; position:absolute; inset:-1.5px; border-radius:inherit; padding:1.5px; pointer-events:none; background:var(--rainbow); background-size:300% 100%; animation:flow 6s linear infinite; opacity:.55; transition:opacity .3s;
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; }
  .glow-btn { background:var(--grad); background-size:160% 100%; color:#fff; transition:.3s; box-shadow:0 8px 24px -8px rgba(155,109,255,.7); }
  .glow-btn:hover { background-position:100% 0; transform:translateY(-1px); box-shadow:0 12px 30px -8px rgba(255,111,177,.6); }
  .glow-btn:disabled { opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }
  .pulse-dot { animation:pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform:scale(.6); opacity:.4; } 50% { transform:scale(1.15); opacity:1; } }
  .msg-in { animation:msgIn .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes msgIn { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  .fade-in { animation:msgIn .45s cubic-bezier(.2,.8,.2,1) both; }
  .drop-active { outline:2px dashed #a78bfa; outline-offset:-10px; }

  /* ================= SIDEBAR ================= */
  .sidebar { background:var(--side); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border-right:1px solid var(--border); }
  .brand { display:flex; align-items:center; gap:.75rem; padding:1.25rem 1.1rem .9rem; }
  .brand-mark { width:2.5rem; height:2.5rem; border-radius:.9rem; display:grid; place-items:center; color:#fff; background:var(--grad); box-shadow:0 8px 22px -6px rgba(155,109,255,.75); }
  .brand-name { font-weight:800; font-size:1.15rem; letter-spacing:-.02em; line-height:1.1; }
  .brand-name b { background:var(--rainbow); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:flow 7s linear infinite; }
  .brand-sub { font-size:.7rem; color:var(--muted); margin-top:2px; }
  .new-chat { margin:.4rem 1rem .6rem; display:flex; align-items:center; gap:.6rem; justify-content:center; padding:.7rem 1rem; border-radius:999px; font-weight:600; font-size:.9rem; color:var(--text);
    background:var(--panel-strong); border:1px solid var(--border-strong); transition:.25s; }
  .new-chat:hover { border-color:#a78bfa; box-shadow:0 0 0 4px rgba(167,139,250,.15); transform:translateY(-1px); }
  .new-chat i { color:#a78bfa; }
  .side-label { padding:.9rem 1.25rem .4rem; font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:var(--muted); }
  .hist { position:relative; display:flex; align-items:center; border-radius:.85rem; transition:.2s; }
  .hist:hover { background:var(--panel); }
  .hist.active { background:var(--panel-strong); }
  .hist.active::before { content:""; position:absolute; left:0; top:20%; bottom:20%; width:3px; border-radius:3px; background:var(--grad); }
  .hist-btn { flex:1; min-width:0; display:flex; align-items:center; gap:.65rem; text-align:left; padding:.62rem .85rem; font-size:.85rem; color:var(--text); }
  .hist-btn i { color:var(--muted); font-size:.8rem; }
  .hist-del { opacity:0; padding:0 .8rem; color:var(--muted); transition:.2s; }
  .hist:hover .hist-del, .hist-del:focus { opacity:1; } .hist-del:hover { color:#f87171; }
  .hist-empty { display:flex; flex-direction:column; align-items:center; gap:.5rem; padding:2.2rem 1rem; color:var(--muted); font-size:.82rem; }
  .hist-empty i { font-size:1.4rem; opacity:.6; }
  .side-foot { display:flex; gap:.5rem; padding:.8rem 1rem 1rem; border-top:1px solid var(--border); }
  .side-btn { flex:1; display:flex; align-items:center; justify-content:center; gap:.5rem; padding:.6rem; border-radius:.85rem; font-size:.84rem; color:var(--text); background:var(--panel); border:1px solid var(--border); transition:.2s; }
  .side-btn:hover { border-color:var(--border-strong); background:var(--panel-strong); }
  .side-btn.danger:hover { color:#f87171; }

  /* ================= TOP BAR ================= */
  .topbar { display:flex; align-items:center; gap:.6rem; padding:.7rem 1rem; }
  .icon-btn { width:2.5rem; height:2.5rem; border-radius:50%; display:grid; place-items:center; color:var(--text); background:var(--panel); border:1px solid var(--border); transition:.2s; }
  .icon-btn:hover { background:var(--panel-strong); border-color:var(--border-strong); transform:translateY(-1px); }
  .model-chip { display:inline-flex; align-items:center; gap:.5rem; padding:.45rem .9rem; border-radius:999px; font-size:.78rem; font-weight:600; color:var(--text); background:var(--panel); border:1px solid var(--border); transition:.2s; }
  .model-chip:hover { border-color:#a78bfa; }
  .model-chip .dot { width:.5rem; height:.5rem; border-radius:50%; background:#34d399; box-shadow:0 0 10px #34d399; }
  .model-chip.nokey .dot { background:#fbbf24; box-shadow:0 0 10px #fbbf24; }

  /* ================= CHAT ================= */
  .user-bubble { max-width:min(86%, 34rem); padding:.8rem 1.1rem; border-radius:1.4rem 1.4rem .4rem 1.4rem; background:var(--panel-strong); border:1px solid var(--border-strong); box-shadow:var(--shadow); }
  .ai-avatar { position:relative; flex:none; width:2.15rem; height:2.15rem; border-radius:50%; display:grid; place-items:center; color:#fff; font-size:.8rem; background:var(--grad); box-shadow:0 6px 18px -4px rgba(155,109,255,.8); }
  .ai-avatar.thinking::after { content:""; position:absolute; inset:-4px; border-radius:50%; background:conic-gradient(from 0deg, #4285f4, #9b72cb, #d96570, #f5a623, #34a853, #4285f4); -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px)); mask:radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px)); animation:spin 1.6s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .skel { height:.7rem; border-radius:999px; background:linear-gradient(90deg, var(--panel) 20%, var(--panel-strong) 50%, var(--panel) 80%); background-size:200% 100%; animation:skel 1.4s linear infinite; }
  @keyframes skel { to { background-position:-200% 0; } }
  .msg-actions { display:flex; gap:.4rem; margin-top:1rem; }
  .act-btn { display:inline-flex; align-items:center; gap:.4rem; padding:.35rem .75rem; border-radius:999px; font-size:.75rem; color:var(--muted); border:1px solid var(--border); transition:.2s; }
  .act-btn:hover { color:var(--text); border-color:#a78bfa; background:var(--panel); }
  .err-card { padding:1rem 1.15rem; border-radius:1.2rem; background:rgba(239,68,68,.08); border:1px solid rgba(239,68,68,.35); }
  .msg-img { max-height:170px; border-radius:.9rem; margin-bottom:.55rem; border:1px solid var(--border); }

  /* ----- Welcome ----- */
  .hero-title { font-size:clamp(2.2rem, 6.4vw, 3.9rem); font-weight:800; letter-spacing:-.035em; line-height:1.08; }
  .hero-sub { font-size:clamp(1.25rem, 3.6vw, 2.1rem); font-weight:600; letter-spacing:-.02em; color:var(--muted); margin-top:.35rem; }
  .sug { display:flex; flex-direction:column; gap:.85rem; text-align:left; padding:1.1rem 1.15rem; border-radius:1.4rem; background:var(--panel); border:1px solid var(--border); transition:.3s cubic-bezier(.2,.8,.2,1); min-height:7.4rem; }
  .sug:hover { transform:translateY(-4px); background:var(--panel-strong); border-color:var(--border-strong); box-shadow:var(--shadow); }
  .sug-ico { width:2.3rem; height:2.3rem; border-radius:.8rem; display:grid; place-items:center; color:#fff; font-size:.9rem; }
  .sug-text { font-size:.88rem; line-height:1.5; color:var(--text); }
  .feat { display:inline-flex; align-items:center; gap:.45rem; padding:.4rem .85rem; border-radius:999px; font-size:.76rem; color:var(--muted); background:var(--panel); border:1px solid var(--border); }

  /* ================= COMPOSER ================= */
  .composer-wrap { padding:.25rem 1rem max(.9rem, env(safe-area-inset-bottom)); }
  .chips { display:flex; gap:.5rem; overflow-x:auto; padding:.2rem .1rem .7rem; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .pill { flex:none; display:inline-flex; align-items:center; gap:.5rem; padding:.5rem .95rem; border-radius:999px; font-size:.8rem; font-weight:500; white-space:nowrap; color:var(--text); background:var(--panel); border:1px solid var(--border); transition:.25s; }
  .pill:hover { transform:translateY(-2px); border-color:#a78bfa; background:var(--panel-strong); box-shadow:0 8px 22px -10px rgba(167,139,250,.8); }
  .composer { background:var(--composer); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); border:1px solid var(--border-strong); border-radius:1.6rem; box-shadow:var(--shadow); padding:.65rem .7rem .6rem 1.1rem; transition:box-shadow .3s; }
  .composer.aurora-border { border-radius:1.6rem; }
  .composer.aurora-border::before { opacity:0; border-radius:1.6rem; }
  .composer.aurora-border:focus-within::before { opacity:1; }
  .composer:focus-within { box-shadow:0 0 0 6px rgba(155,109,255,.08), 0 24px 60px -20px rgba(155,109,255,.45); }
  .composer textarea { width:100%; background:transparent; color:var(--text); font-size:.97rem; line-height:1.55; padding:.35rem 0; max-height:10rem; }
  .composer textarea::placeholder { color:var(--muted); }
  .composer-bar { display:flex; align-items:center; gap:.2rem; margin-top:.2rem; }
  .tool-btn { width:2.4rem; height:2.4rem; border-radius:50%; display:grid; place-items:center; color:var(--muted); transition:.2s; }
  .tool-btn:hover { background:var(--panel-strong); color:var(--text); }
  .send-btn { margin-left:auto; width:2.7rem; height:2.7rem; border-radius:50%; display:grid; place-items:center; font-size:.95rem; }
  .disclaimer { text-align:center; font-size:.68rem; color:var(--muted); margin-top:.55rem; }
  .thumb-chip { display:inline-flex; align-items:center; gap:.6rem; padding:.4rem; border-radius:1rem; background:var(--panel-strong); border:1px solid var(--border-strong); margin-bottom:.6rem; }

  /* ================= MARKDOWN ================= */
  .md { line-height:1.8; font-size:.97rem; overflow-wrap:anywhere; }
  .md > *:first-child { margin-top:0; } .md > *:last-child { margin-bottom:0; }
  .md h1, .md h2, .md h3 { font-weight:700; letter-spacing:-.015em; line-height:1.35; }
  .md h1 { font-size:1.4rem; margin:1.4em 0 .6em; }
  .md h2 { display:flex; align-items:center; gap:.5rem; font-size:1.08rem; margin:2.1em 0 .8em; padding-bottom:.6rem; border-bottom:1px solid transparent; border-image:linear-gradient(90deg, rgba(155,109,255,.7), rgba(79,141,255,.25), transparent) 1; }
  .md h3 { font-size:1rem; margin:1.4em 0 .5em; color:#a78bfa; }
  html[data-theme="light"] .md h3 { color:#7c3aed; }
  .md p { margin:.7em 0; }
  .md ul { list-style:none; padding-left:0; margin:.6em 0; }
  .md ul > li { position:relative; padding-left:1.35rem; margin:.4em 0; }
  .md ul > li::before { content:""; position:absolute; left:.25rem; top:.72em; width:.42rem; height:.42rem; border-radius:50%; background:var(--grad); }
  .md ol { list-style:none; padding-left:0; margin:.8em 0; counter-reset:step; }
  .md ol > li { position:relative; counter-increment:step; padding-left:2.8rem; margin:1rem 0; }
  .md ol > li::before { content:counter(step); position:absolute; left:0; top:.1rem; width:1.85rem; height:1.85rem; border-radius:50%; display:grid; place-items:center; font-size:.78rem; font-weight:700; color:#fff; background:var(--grad); box-shadow:0 6px 16px -6px rgba(155,109,255,.8); }
  .md li > ol, .md li > ul { margin:.4em 0; }
  .md strong { font-weight:700; }
  .md blockquote { position:relative; margin:1em 0; padding:.8rem 1.1rem .8rem 1.2rem; border-radius:1rem; background:rgba(245,158,11,.09); border:1px solid rgba(245,158,11,.28); }
  .md blockquote::before { content:""; position:absolute; left:0; top:12%; bottom:12%; width:3px; border-radius:3px; background:#f59e0b; }
  .md blockquote p { margin:.2em 0; }
  .md code { background:var(--code); padding:.12em .45em; border-radius:.4rem; font-size:.86em; }
  .md pre { background:var(--code); border:1px solid var(--border); padding:1rem; border-radius:1rem; overflow-x:auto; margin:1em 0; }
  .md pre code { background:none; padding:0; }
  .md table { border-collapse:separate; border-spacing:0; margin:1em 0; display:block; overflow-x:auto; border:1px solid var(--border); border-radius:.9rem; }
  .md th, .md td { padding:.55rem .9rem; border-bottom:1px solid var(--border); text-align:left; }
  .md th { background:var(--panel-strong); font-weight:600; font-size:.88rem; }
  .md tr:last-child td { border-bottom:0; }
  .md hr { border:0; border-top:1px solid var(--border); margin:1.6em 0; }
  .md a { color:#7aa7ff; text-decoration:underline; text-underline-offset:3px; }
  .md .katex { font-size:1.08em; }
  .md .katex-display { margin:.9em 0; padding:.9rem 1rem; border-radius:1rem; background:var(--panel); border:1px solid var(--border); overflow-x:auto; overflow-y:hidden; }

  /* ================= GEOMETRY ================= */
  .geo-card { margin:1.2rem 0; border-radius:1.3rem; overflow:hidden; border:1px solid var(--border-strong); background:var(--board); box-shadow:var(--shadow); }
  .geo-head { display:flex; justify-content:space-between; align-items:center; gap:.5rem; padding:.65rem .95rem; font-size:.82rem; font-weight:600; border-bottom:1px solid var(--border); background:var(--panel); }
  .geo-btn { color:var(--text); transition:.2s; } .geo-btn:hover { border-color:#a78bfa; color:#a78bfa; }
  .geo-board { width:100%; height:380px; position:relative; touch-action:none; }
  .geo-board canvas { width:100%; height:100%; display:block; cursor:grab; }
  .geo-board .jxgbox { background:var(--board) !important; border:0 !important; }
  .geo-tip { position:absolute; pointer-events:none; padding:3px 9px; border-radius:7px; font-size:11px; background:#111827; color:#fff; transform:translate(10px,-26px); white-space:nowrap; }
  .geo-err { padding:.55rem .95rem; font-size:.75rem; color:#fbbf24; }

  /* ================= MODAL & TOASTS ================= */
  .modal-card { background:var(--bg2); border-radius:1.5rem; padding:1.4rem; box-shadow:0 40px 90px -20px rgba(0,0,0,.7); }
  .field { width:100%; background:var(--panel); border:1px solid var(--border-strong); border-radius:.95rem; padding:.7rem .95rem; font-size:.9rem; color:var(--text); transition:.2s; }
  .field:focus { border-color:#a78bfa; box-shadow:0 0 0 4px rgba(167,139,250,.18); }
  .model-card { border:1px solid var(--border); background:var(--panel); border-radius:1.1rem; padding:.9rem; text-align:left; transition:.25s; }
  .model-card:hover { transform:translateY(-2px); }
  .btn-soft { display:inline-flex; align-items:center; justify-content:center; gap:.4rem; padding:.7rem 1.1rem; border-radius:999px; font-size:.86rem; font-weight:600; background:var(--panel-strong); border:1px solid var(--border-strong); color:var(--text); transition:.2s; }
  .btn-soft:hover { border-color:#a78bfa; }
  #toasts { position:fixed; top:16px; right:16px; z-index:100; display:flex; flex-direction:column; gap:10px; max-width:min(92vw, 390px); }
  .toast { padding:.8rem 1.05rem; border-radius:1rem; font-size:.85rem; color:#fff; display:flex; gap:.65rem; align-items:flex-start; animation:msgIn .35s ease both; box-shadow:0 14px 36px rgba(0,0,0,.4); backdrop-filter:blur(10px); }
  .toast.error { background:linear-gradient(90deg,#dc2626,#be185d); }
  .toast.success { background:linear-gradient(90deg,#059669,#0d9488); }
  .toast.info { background:linear-gradient(90deg,#2563eb,#7c3aed); }

  .tool-btn.listening { color:#f87171; background:rgba(248,113,113,.12); }

</style>
</head>

<body>
<div class="bg-layer"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><div class="grid-dots"></div></div>
<div id="toasts"></div>

<div class="relative z-10 flex h-full">

  <!-- ===================== SIDEBAR ===================== -->
  <div id="backdrop" class="fixed inset-0 bg-black/55 backdrop-blur-sm z-20 hidden lg:hidden" onclick="toggleSidebar(false)"></div>
  <aside id="sidebar" class="sidebar fixed lg:static z-30 inset-y-0 left-0 w-[19rem] max-w-[86vw] -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col">
    <div class="brand">
      <div class="brand-mark"><i class="fa-solid fa-graduation-cap"></i></div>
      <div>
        <div class="brand-name">EduAI <b>Pro</b></div>
        <div class="brand-sub">   MOD BY PHUCHUYNH  </div>

<script>
/* =====================================================================
   0. CONFIG & CONSTANTS
   ===================================================================== */
// API key nằm trong file .env phía server (server.js) – trình duyệt chỉ gọi proxy nội bộ này.
const API_URL = '/api/generate';
const MODELS = { 'gemini-2.5-flash': 'Gemini 2.5 Flash', 'gemini-2.5-pro': 'Gemini 2.5 Pro' };
const LS = { model: 'eduai_model', theme: 'eduai_theme', convs: 'eduai_convs', cur: 'eduai_cur' };
const MAX_CONTEXT_MESSAGES = 20;

/** System prompt: "Giáo viên siêu chi tiết" + giao thức vẽ hình hình học */
const SYSTEM_PROMPT = `Bạn là EduAI Pro – một giáo viên giỏi, kiên nhẫn, tận tâm, giảng bài như đang đứng lớp. Luôn trả lời bằng ngôn ngữ của học sinh (mặc định tiếng Việt), giọng thân thiện, rõ ràng, khuyến khích.

## QUY TẮC TRÌNH BÀY
- Dùng Markdown. Công thức toán/lý/hoá viết bằng LaTeX: $...$ cho công thức trong dòng, $$...$$ cho công thức đứng riêng. Không dùng \`\\(\` hay \`\\[\`.
- Khi học sinh gửi một BÀI TẬP / ĐỀ BÀI (kể cả qua ảnh), trả lời ĐÚNG cấu trúc 5 phần sau, mỗi phần là một tiêu đề cấp 2:
## 📝 Tóm tắt đề bài
(Cho biết gì? Cần tìm/chứng minh gì? Nếu đọc từ ảnh, chép lại đề ngắn gọn để học sinh xác nhận.)
## 🧭 Phương pháp & Định hướng
(Dùng công thức/định lý nào, vì sao chọn hướng này.)
## 🪜 Lời giải chi tiết từng bước
(Đánh số Bước 1, Bước 2,… Mỗi bước nêu lý do, biến đổi cụ thể, kết quả trung gian. Kết thúc bằng **Đáp số** in đậm.)
## 💡 Mẹo & Lưu ý
(Lỗi sai thường gặp, cách giải khác, cách kiểm tra lại kết quả.)
## ❓ Câu hỏi gợi mở củng cố
(2–3 câu hỏi ngắn kiểm tra học sinh đã hiểu chưa; có thể gợi ý, KHÔNG đưa đáp án ngay.)
- Với câu hỏi lý thuyết/giải thích khái niệm: giảng theo phương pháp gợi mở, có ví dụ đời thường, vẫn kết thúc bằng 2–3 câu hỏi củng cố.
- Với yêu cầu "giảng lại dễ hiểu hơn": dùng ngôn từ đơn giản, ví von, ví dụ, chia nhỏ từng ý, tránh thuật ngữ khi chưa giải thích.
- Với yêu cầu "tạo bài tập tương tự": đưa 3 bài cùng dạng với độ khó tăng dần, kèm đáp số ở cuối trong phần ẩn dưới tiêu đề "Đáp số tham khảo".
- Luôn tính toán cẩn thận, tự kiểm tra lại đáp án trước khi trả lời.

## GIAO THỨC VẼ HÌNH (HÌNH HỌC)
Khi bài toán liên quan hình học (tam giác, tứ giác, đường tròn, góc, hình học toạ độ…) hoặc học sinh yêu cầu vẽ hình, hãy chèn ĐÚNG MỘT khối mã có ngôn ngữ \`geometry\` chứa JSON hợp lệ (không chú thích, không dấu phẩy thừa), đặt ngay sau phần "Phương pháp & Định hướng" (hoặc ở đầu câu trả lời nếu chỉ yêu cầu vẽ hình).
Hãy CHỌN HỆ TOẠ ĐỘ HỢP LÝ và TÍNH CHÍNH XÁC toạ độ để hình thoả mọi điều kiện đề bài (độ dài, góc vuông, trung điểm, đường cao, tiếp tuyến…). Với hình có số đo cụ thể, vẽ đúng tỉ lệ.
Lược đồ JSON (mọi khoá đều tuỳ chọn trừ "points"):
\`\`\`geometry
{
  "title": "Tam giác ABC vuông tại A",
  "points": [ {"name":"A","x":0,"y":0}, {"name":"B","x":4,"y":0}, {"name":"C","x":0,"y":3} ],
  "segments": [ ["A","B"], ["B","C"], ["C","A"] ],
  "dashed": [ ["A","H"] ],
  "lines": [ ["A","B"] ],
  "polygons": [ ["A","B","C"] ],
  "circles": [ {"center":"O","radius":2.5}, {"center":"O","through":"A"} ],
  "angles": [ {"points":["B","A","C"],"label":"90°"} ],
  "texts": [ {"x":2,"y":1.5,"text":"5"} ],
  "axes": false
}
\`\`\`
Chú thích: "segments" = đoạn thẳng; "lines" = đường thẳng kéo dài vô hạn; "polygons" = đa giác tô màu; "angles" = góc tại điểm GIỮA (points: [điểm đầu, ĐỈNH, điểm cuối]); "axes": true cho bài toán toạ độ Oxy. Tên điểm dùng ký tự đơn như A, B, H, O, M, A1. Mọi điểm được tham chiếu phải có trong "points". Sau khối mã, giải thích ngắn gọn cách đặt toạ độ.`;

/* =====================================================================
   1. STATE & HELPERS
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const state = { convs: [], cur: null, busy: false, pendingImg: null, error: null, recog: null, listening: false };
let geoCounter = 0;
const geoSpecs = {};          // id -> spec
const geoMode = {};           // id -> 'jsx' | 'canvas'
const geoBoards = {};         // id -> JXG board or canvas controller

const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const lsGet = (k, d = null) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };

function toast(msg, type = 'info', ms = 4500) {
  const icons = { error: 'fa-circle-exclamation', success: 'fa-circle-check', info: 'fa-circle-info' };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<i class="fa-solid ${icons[type]} mt-0.5"></i><div class="flex-1">${escapeHtml(msg)}</div>`;
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; setTimeout(() => el.remove(), 300); }, ms);
}

const getModel = () => { const m = lsGet(LS.model, 'gemini-2.5-flash'); return MODELS[m] ? m : 'gemini-2.5-flash'; };
const curConv = () => state.convs.find((c) => c.id === state.cur) || null;

/* =====================================================================
   2. THEME & SIDEBAR
   ===================================================================== */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  document.documentElement.classList.toggle('dark', t === 'dark');
  $('themeIcon').className = t === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  lsSet(LS.theme, t);
  renderAllGeometry(); // vẽ lại hình theo màu mới
}
function toggleTheme() { applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'); }
function toggleSidebar(open) {
  $('sidebar').classList.toggle('-translate-x-full', !open);
  $('backdrop').classList.toggle('hidden', !open);
}

/* =====================================================================
   3. MARKDOWN + KATEX + GEOMETRY PIPELINE
   ===================================================================== */
/**
 * Quy trình: (1) tách khối ```geometry, (2) giấu code, (3) giấu công thức toán,
 * (4) khôi phục code -> marked -> DOMPurify, (5) chèn KaTeX & khung hình vẽ.
 * Cách này tránh việc Markdown làm hỏng dấu \ _ * trong LaTeX.
 */
function renderMarkdown(text) {
  const geos = [], codes = [], maths = [];
  let t = String(text || '');

  // (1) geometry blocks
  t = t.replace(/```geometry\s*\n([\s\S]*?)```/gi, (_, body) => { geos.push(body); return `\n\n@@GEO${geos.length - 1}@@\n\n`; });
  // (2) protect code
  t = t.replace(/```[\s\S]*?```|`[^`\n]+`/g, (m) => { codes.push(m); return `@@CODE${codes.length - 1}@@`; });
  // (3) protect math
  const stash = (src, display) => { maths.push({ src, display }); return `@@MATH${maths.length - 1}@@`; };
  t = t.replace(/\$\$([\s\S]+?)\$\$/g, (_, s) => '\n\n' + stash(s, true) + '\n\n');
  t = t.replace(/\\\[([\s\S]+?)\\\]/g, (_, s) => '\n\n' + stash(s, true) + '\n\n');
  t = t.replace(/\\\(([\s\S]+?)\\\)/g, (_, s) => stash(s, false));
  t = t.replace(/\$(?!\s)([^$\n]*?[^\s$])\$(?!\d)/g, (_, s) => stash(s, false));
  // (4) restore code, markdown, sanitize
  t = t.replace(/@@CODE(\d+)@@/g, (_, i) => codes[+i]);
  let html = (window.marked ? marked.parse(t, { breaks: true, gfm: true }) : escapeHtml(t).replace(/\n/g, '<br>'));
  html = window.DOMPurify ? DOMPurify.sanitize(html) : html;
  // (5) math & geometry
  html = html.replace(/@@MATH(\d+)@@/g, (_, i) => {
    const { src, display } = maths[+i];
    try {
      if (window.katex) return katex.renderToString(src.trim(), { displayMode: display, throwOnError: false, strict: 'ignore' });
    } catch (e) { /* fallthrough */ }
    return `<code>${escapeHtml(src)}</code>`;
  });
  html = html.replace(/(?:<p>)?@@GEO(\d+)@@(?:<\/p>)?/g, (_, i) => geoShell(geos[+i]));
  return html;
}

/** Tạo khung (shell) cho hình vẽ; việc vẽ thực hiện sau khi chèn vào DOM */
function geoShell(raw) {
  const id = 'geo-' + (++geoCounter);
  let spec = null, err = '';
  try { spec = parseGeoJSON(raw); } catch (e) { err = e.message; }
  if (!spec) {
    return `<div class="geo-card"><div class="geo-head"><span><i class="fa-solid fa-triangle-exclamation text-yellow-400 mr-1"></i>Không đọc được dữ liệu hình vẽ</span></div><div class="geo-err">${escapeHtml(err)}</div><pre class="!m-2 text-xs">${escapeHtml(raw)}</pre></div>`;
  }
  geoSpecs[id] = spec; geoMode[id] = window.JXG ? 'jsx' : 'canvas';
  return `<div class="geo-card" data-geo-card="${id}">
    <div class="geo-head">
      <span><i class="fa-solid fa-shapes text-blue-400 mr-1"></i>${escapeHtml(spec.title || 'Hình minh họa')}</span>
      <span class="flex gap-1.5 items-center">
        <span class="text-[10px] opacity-70" data-geo-engine="${id}"></span>
        <button class="geo-btn glass rounded-lg px-2 py-1" data-geo-switch="${id}" title="Đổi bộ vẽ"><i class="fa-solid fa-repeat"></i></button>
        <button class="geo-btn glass rounded-lg px-2 py-1" data-geo-reset="${id}" title="Đặt lại khung nhìn"><i class="fa-solid fa-expand"></i></button>
      </span>
    </div>
    <div class="geo-board" id="${id}"></div><div class="geo-err hidden" data-geo-err="${id}"></div>
  </div>`;
}

function parseGeoJSON(raw) {
  let s = raw.trim().replace(/^```(?:json|geometry)?/i, '').replace(/```$/, '').trim();
  s = s.replace(/,\s*([}\]])/g, '$1'); // dấu phẩy thừa
  const spec = JSON.parse(s);
  if (!spec || !Array.isArray(spec.points) || !spec.points.length) throw new Error('Thiếu mảng "points".');
  spec.points = spec.points.filter((p) => p && p.name != null && isFinite(+p.x) && isFinite(+p.y)).map((p) => ({ name: String(p.name), x: +p.x, y: +p.y }));
  if (!spec.points.length) throw new Error('Không có điểm hợp lệ.');
  return spec;
}

/* ---------- Geometry rendering: compute the view ---------- */
function computeView(spec, w, h) {
  let xs = spec.points.map((p) => p.x), ys = spec.points.map((p) => p.y);
  const byName = Object.fromEntries(spec.points.map((p) => [p.name, p]));
  (spec.circles || []).forEach((c) => {
    const o = byName[c.center]; if (!o) return;
    const r = c.radius != null ? +c.radius : (byName[c.through] ? Math.hypot(byName[c.through].x - o.x, byName[c.through].y - o.y) : 0);
    xs.push(o.x - r, o.x + r); ys.push(o.y - r, o.y + r);
  });
  (spec.texts || []).forEach((t) => { if (isFinite(+t.x) && isFinite(+t.y)) { xs.push(+t.x); ys.push(+t.y); } });
  if (spec.axes) { xs.push(0); ys.push(0); }
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const dx = Math.max(maxX - minX, 1), dy = Math.max(maxY - minY, 1);
  const scale = Math.max(dx / (w * 0.72), dy / (h * 0.72)); // world units per pixel
  return { cx: (minX + maxX) / 2, cy: (minY + maxY) / 2, scale, w, h };
}

const geoColors = () => {
  const s = getComputedStyle(document.documentElement);
  return { line: s.getPropertyValue('--board-line').trim(), text: s.getPropertyValue('--board-text').trim(), grid: s.getPropertyValue('--grid').trim(), bg: s.getPropertyValue('--board').trim() };
};

/* ---------- JSXGraph renderer ---------- */
function renderJSX(id, spec) {
  const el = $(id); const view = computeView(spec, el.clientWidth || 600, el.clientHeight || 360);
  const col = geoColors();
  const bb = [view.cx - view.scale * view.w / 2, view.cy + view.scale * view.h / 2, view.cx + view.scale * view.w / 2, view.cy - view.scale * view.h / 2];
  const board = JXG.JSXGraph.initBoard(id, {
    boundingbox: bb, axis: !!spec.axes, grid: !!spec.axes, keepaspectratio: true, showCopyright: false, showNavigation: true,
    pan: { enabled: true, needTwoFingers: false }, zoom: { wheel: true, needShift: false, pinch: true }
  });
  const P = {};
  spec.points.forEach((p) => {
    P[p.name] = board.create('point', [p.x, p.y], {
      name: p.name, size: 3.5, fixed: true, fillColor: '#f43f5e', strokeColor: '#f43f5e', highlightFillColor: '#fbbf24', highlightStrokeColor: '#fbbf24',
      label: { strokeColor: col.text, fontSize: 15, offset: [8, 8], highlight: true }, showInfobox: true
    });
  });
  const has = (arr) => arr.every((n) => P[n]);
  (spec.polygons || []).forEach((poly) => { if (Array.isArray(poly) && has(poly)) board.create('polygon', poly.map((n) => P[n]), {
    fillColor: '#8b5cf6', fillOpacity: .13, vertices: { visible: false }, borders: { strokeColor: col.line, strokeWidth: 2, highlight: false }, highlight: false, hasInnerPoints: false }); });
  (spec.segments || []).forEach((s) => { if (Array.isArray(s) && has(s.slice(0, 2))) board.create('segment', [P[s[0]], P[s[1]]], { strokeColor: col.line, strokeWidth: 2, fixed: true, highlight: false }); });
  (spec.dashed || []).forEach((s) => { if (Array.isArray(s) && has(s.slice(0, 2))) board.create('segment', [P[s[0]], P[s[1]]], { strokeColor: '#f59e0b', strokeWidth: 2, dash: 2, fixed: true, highlight: false }); });
  (spec.lines || []).forEach((s) => { if (Array.isArray(s) && has(s.slice(0, 2))) board.create('line', [P[s[0]], P[s[1]]], { strokeColor: '#22d3ee', strokeWidth: 1.5, fixed: true, highlight: false }); });
  (spec.circles || []).forEach((c) => {
    if (!P[c.center]) return;
    const arg = c.radius != null ? [P[c.center], +c.radius] : (P[c.through] ? [P[c.center], P[c.through]] : null);
    if (arg) board.create('circle', arg, { strokeColor: '#34d399', strokeWidth: 2, fillColor: '#34d399', fillOpacity: .06, fixed: true, highlight: false, center: { visible: true } });
  });
  (spec.angles || []).forEach((a) => {
    if (!Array.isArray(a.points) || a.points.length !== 3 || !has(a.points)) return;
    board.create('angle', [P[a.points[0]], P[a.points[1]], P[a.points[2]]], {
      radius: 0.9 * view.scale * 40, name: a.label || '', fillColor: '#fbbf24', fillOpacity: .3, strokeColor: '#fbbf24', highlight: false,
      label: { strokeColor: col.text, fontSize: 13 }, orthoType: 'square', orthoSensitivity: 1.5, type: 'sector' });
  });
  (spec.texts || []).forEach((t) => { if (isFinite(+t.x) && isFinite(+t.y)) board.create('text', [+t.x, +t.y, String(t.text ?? '')], { strokeColor: col.text, fontSize: 14, fixed: true }); });
  board._eduView = bb;
  return board;
}

/* ---------- Canvas fallback renderer (never fails) ---------- */
function renderCanvas(id, spec) {
  const el = $(id); el.innerHTML = '';
  const cv = document.createElement('canvas'); el.appendChild(cv);
  const tip = document.createElement('div'); tip.className = 'geo-tip'; tip.style.display = 'none'; el.appendChild(tip);
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = el.clientWidth || 600, H = el.clientHeight || 360;
  cv.width = W * dpr; cv.height = H * dpr;
  const init = computeView(spec, W, H);
  let v = { ...init };
  const col = geoColors();
  const byName = Object.fromEntries(spec.points.map((p) => [p.name, p]));
  const toS = (x, y) => [W / 2 + (x - v.cx) / v.scale, H / 2 - (y - v.cy) / v.scale];

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.lineJoin = 'round'; ctx.font = '600 14px Be Vietnam Pro, sans-serif';
    // axes + grid
    if (spec.axes) {
      const step = niceStep(v.scale * 60);
      const x0 = v.cx - v.scale * W / 2, x1 = v.cx + v.scale * W / 2, y0 = v.cy - v.scale * H / 2, y1 = v.cy + v.scale * H / 2;
      ctx.strokeStyle = col.grid; ctx.lineWidth = 1; ctx.fillStyle = col.text; ctx.font = '11px Be Vietnam Pro, sans-serif';
      for (let x = Math.ceil(x0 / step) * step; x <= x1; x += step) { const [sx] = toS(x, 0); ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke(); ctx.fillText(+x.toFixed(6), sx + 3, toS(0, 0)[1] + 12); }
      for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) { const [, sy] = toS(0, y); ctx.beginPath(); ctx.moveTo(0, sy); ctx.lineTo(W, sy); ctx.stroke(); if (Math.abs(y) > 1e-9) ctx.fillText(+y.toFixed(6), toS(0, 0)[0] + 4, sy - 3); }
      ctx.strokeStyle = col.text; ctx.lineWidth = 1.5;
      const [ox, oy] = toS(0, 0);
      ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.stroke();
      ctx.font = '600 14px Be Vietnam Pro, sans-serif';
    }
    const ok = (arr) => arr.every((n) => byName[n]);
    // polygons
    (spec.polygons || []).forEach((poly) => {
      if (!Array.isArray(poly) || !ok(poly)) return;
      ctx.beginPath(); poly.forEach((n, i) => { const [x, y] = toS(byName[n].x, byName[n].y); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath();
      ctx.fillStyle = 'rgba(139,92,246,.14)'; ctx.fill(); ctx.strokeStyle = col.line; ctx.lineWidth = 2; ctx.stroke();
    });
    // circles
    (spec.circles || []).forEach((c) => {
      const o = byName[c.center]; if (!o) return;
      const r = c.radius != null ? +c.radius : (byName[c.through] ? Math.hypot(byName[c.through].x - o.x, byName[c.through].y - o.y) : 0);
      const [sx, sy] = toS(o.x, o.y);
      ctx.beginPath(); ctx.arc(sx, sy, r / v.scale, 0, Math.PI * 2); ctx.fillStyle = 'rgba(52,211,153,.07)'; ctx.fill(); ctx.strokeStyle = '#34d399'; ctx.lineWidth = 2; ctx.stroke();
    });
    // segments
    const seg = (a, b, color, dash) => { if (!ok([a, b])) return; const [x1, y1] = toS(byName[a].x, byName[a].y), [x2, y2] = toS(byName[b].x, byName[b].y);
      ctx.beginPath(); ctx.setLineDash(dash ? [7, 5] : []); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]); };
    (spec.segments || []).forEach((s) => Array.isArray(s) && seg(s[0], s[1], col.line, false));
    (spec.dashed || []).forEach((s) => Array.isArray(s) && seg(s[0], s[1], '#f59e0b', true));
    // infinite lines
    (spec.lines || []).forEach((s) => {
      if (!Array.isArray(s) || !ok(s.slice(0, 2))) return;
      const a = byName[s[0]], b = byName[s[1]]; const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1, k = 1e4;
      const [x1, y1] = toS(a.x - dx / L * k, a.y - dy / L * k), [x2, y2] = toS(a.x + dx / L * k, a.y + dy / L * k);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.strokeStyle = '#22d3ee'; ctx.lineWidth = 1.5; ctx.stroke();
    });
    // angles
    (spec.angles || []).forEach((an) => {
      if (!Array.isArray(an.points) || an.points.length !== 3 || !ok(an.points)) return;
      const [A, B, C] = an.points.map((n) => byName[n]);
      let a1 = Math.atan2(A.y - B.y, A.x - B.x), a2 = Math.atan2(C.y - B.y, C.x - B.x);
      let d = a2 - a1; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
      if (d < 0) { a1 = a2; d = -d; }
      const [bx, by] = toS(B.x, B.y), r = 26;
      ctx.beginPath(); ctx.moveTo(bx, by);
      if (Math.abs(d - Math.PI / 2) < 0.02) { // right angle square
        const p1 = [bx + r * .6 * Math.cos(a1), by - r * .6 * Math.sin(a1)], p2 = [bx + r * .6 * Math.cos(a1 + d), by - r * .6 * Math.sin(a1 + d)];
        ctx.lineTo(...p1); ctx.lineTo(p1[0] + p2[0] - bx, p1[1] + p2[1] - by); ctx.lineTo(...p2);
      } else ctx.arc(bx, by, r, -a1, -a1 - d, true);
      ctx.closePath(); ctx.fillStyle = 'rgba(251,191,36,.3)'; ctx.fill(); ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 1.5; ctx.stroke();
      if (an.label) { const am = a1 + d / 2; ctx.fillStyle = col.text; ctx.font = '600 12px Be Vietnam Pro, sans-serif'; ctx.fillText(an.label, bx + (r + 8) * Math.cos(am) - 8, by - (r + 8) * Math.sin(am) + 4); }
    });
    // texts
    ctx.font = '600 13px Be Vietnam Pro, sans-serif';
    (spec.texts || []).forEach((t) => { if (!isFinite(+t.x) || !isFinite(+t.y)) return; const [x, y] = toS(+t.x, +t.y); ctx.fillStyle = col.text; ctx.fillText(String(t.text ?? ''), x, y); });
    // points
    ctx.font = '700 15px Be Vietnam Pro, sans-serif';
    spec.points.forEach((p) => { const [x, y] = toS(p.x, p.y); ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fillStyle = '#f43f5e'; ctx.fill(); ctx.fillStyle = col.text; ctx.fillText(p.name, x + 7, y - 7); });
  }
  function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p; }

  // Interaction: pan, wheel zoom, hover inspect
  let drag = null;
  const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * (W / r.width), (e.clientY - r.top) * (H / r.height)]; };
  cv.addEventListener('pointerdown', (e) => { drag = { p: pos(e), cx: v.cx, cy: v.cy }; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; });
  cv.addEventListener('pointerup', () => { drag = null; cv.style.cursor = 'grab'; });
  cv.addEventListener('pointermove', (e) => {
    const [mx, my] = pos(e);
    if (drag) { v.cx = drag.cx - (mx - drag.p[0]) * v.scale; v.cy = drag.cy + (my - drag.p[1]) * v.scale; draw(); tip.style.display = 'none'; return; }
    const hit = spec.points.find((p) => { const [x, y] = toS(p.x, p.y); return Math.hypot(x - mx, y - my) < 10; });
    if (hit) { tip.style.display = 'block'; tip.textContent = `${hit.name} (${+hit.x.toFixed(3)}; ${+hit.y.toFixed(3)})`; tip.style.left = mx + 'px'; tip.style.top = my + 'px'; } else tip.style.display = 'none';
  });
  cv.addEventListener('wheel', (e) => {
    e.preventDefault(); const [mx, my] = pos(e); const f = e.deltaY < 0 ? 0.88 : 1.14;
    const wx = v.cx + (mx - W / 2) * v.scale, wy = v.cy - (my - H / 2) * v.scale;
    v.scale *= f; v.cx = wx - (mx - W / 2) * v.scale; v.cy = wy + (my - H / 2) * v.scale; draw();
  }, { passive: false });
  draw();
  return { reset() { v = { ...init }; draw(); } };
}

/** Vẽ một hình: ưu tiên JSXGraph, lỗi thì tự động chuyển sang Canvas */
function drawGeometry(id) {
  const el = $(id); if (!el) return; const spec = geoSpecs[id];
  const errEl = document.querySelector(`[data-geo-err="${id}"]`);
  const engineEl = document.querySelector(`[data-geo-engine="${id}"]`);
  // dọn board cũ
  if (geoBoards[id] && window.JXG && geoBoards[id].type === 'jsx') { try { JXG.JSXGraph.freeBoard(geoBoards[id].obj); } catch {} }
  el.innerHTML = ''; errEl && errEl.classList.add('hidden');
  let mode = geoMode[id];
  if (mode === 'jsx' && window.JXG) {
    try { const b = renderJSX(id, spec); geoBoards[id] = { type: 'jsx', obj: b }; engineEl && (engineEl.textContent = 'JSXGraph'); return; }
    catch (e) {
      console.warn('JSXGraph lỗi, chuyển sang Canvas:', e);
      try { JXG.JSXGraph.freeBoard(JXG.boards[id]); } catch {}
      el.innerHTML = ''; geoMode[id] = 'canvas';
      if (errEl) { errEl.textContent = 'JSXGraph gặp lỗi – đã chuyển sang bộ vẽ Canvas dự phòng.'; errEl.classList.remove('hidden'); }
    }
  }
  try { geoBoards[id] = { type: 'canvas', obj: renderCanvas(id, spec) }; engineEl && (engineEl.textContent = 'Canvas'); }
  catch (e) { if (errEl) { errEl.textContent = 'Không thể vẽ hình: ' + e.message; errEl.classList.remove('hidden'); } }
}
function renderAllGeometry(root = document) { root.querySelectorAll('[data-geo-card]').forEach((c) => drawGeometry(c.dataset.geoCard)); }

/* =====================================================================
   6. GEMINI API
   ===================================================================== */
class AppError extends Error { constructor(msg, code) { super(msg); this.code = code; } }

function friendlyError(status, apiMsg = '') {
  if (apiMsg.startsWith('[EduAI]')) return apiMsg.replace('[EduAI] ', ''); // thông báo từ server.js
  const m = apiMsg.toLowerCase();
  if (status === 400 && (m.includes('api key') || m.includes('api_key'))) return 'GEMINI_API_KEY trong file .env không hợp lệ. Hãy kiểm tra lại rồi khởi động lại server.';
  if (status === 400) return 'Yêu cầu không hợp lệ: ' + (apiMsg || 'vui lòng thử lại với nội dung/ảnh khác.');
  if (status === 401 || status === 403) return 'API key trong .env không có quyền truy cập mô hình này (hoặc bị chặn). Kiểm tra lại key.';
  if (status === 404) return 'Không tìm thấy mô hình. Hãy chọn mô hình khác trong Cài đặt.';
  if (status === 429) return 'Đã vượt giới hạn tốc độ/hạn mức (rate limit). Vui lòng đợi một lát rồi thử lại.';
  if (status >= 500) return 'Máy chủ Gemini đang quá tải hoặc gặp sự cố. Hãy thử lại sau ít phút.';
  return 'Lỗi không xác định' + (apiMsg ? ': ' + apiMsg : '.');
}

/** Gọi Gemini generateContent. `messages` = [{role:'user'|'model', text, img?}] */
async function callGemini(messages, { system = SYSTEM_PROMPT, model = getModel(), maxMessages = MAX_CONTEXT_MESSAGES } = {}) {
  const contents = messages.slice(-maxMessages).map((m) => {
    const parts = [];
    if (m.img && m.img.data) parts.push({ inlineData: { mimeType: m.img.mime, data: m.img.data } });
    else if (m.img) parts.push({ text: '[Học sinh đã gửi kèm một ảnh ở lượt trước]' });
    parts.push({ text: m.text || '(Hãy giải bài trong ảnh)' });
    return { role: m.role === 'user' ? 'user' : 'model', parts };
  });
  // Gemini yêu cầu lượt đầu là 'user'
  while (contents.length && contents[0].role !== 'user') contents.shift();

  let res;
  try {
    res = await fetch(`${API_URL}?model=${encodeURIComponent(model)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: system }] },
        contents,
        generationConfig: { temperature: 0.5, topP: 0.95, maxOutputTokens: 8192 }
      })
    });
  } catch (e) { throw new AppError('Không kết nối được tới máy chủ EduAI. Hãy chắc chắn server đang chạy (node server.js) rồi thử lại.', 'NETWORK'); }

  let data = null; try { data = await res.json(); } catch {}
  if (!res.ok) throw new AppError(friendlyError(res.status, data?.error?.message || ''), 'HTTP_' + res.status);
  const cand = data?.candidates?.[0];
  if (data?.promptFeedback?.blockReason) throw new AppError('Nội dung bị chặn bởi bộ lọc an toàn (' + data.promptFeedback.blockReason + '). Hãy thử diễn đạt khác.', 'BLOCKED');
  const text = (cand?.content?.parts || []).map((p) => p.text || '').join('').trim();
  if (!text) throw new AppError(cand?.finishReason === 'SAFETY' ? 'Phản hồi bị chặn bởi bộ lọc an toàn.' : 'Mô hình không trả về nội dung. Hãy thử lại.', 'EMPTY');
  return text + (cand.finishReason === 'MAX_TOKENS' ? '\n\n> ⚠️ Câu trả lời bị cắt do quá dài. Bấm "Giảng lại" hoặc hỏi tiếp để xem phần còn lại.' : '');
}

/* =====================================================================
   7. SENDING FLOW + QUICK ACTIONS
   ===================================================================== */
const ACTIONS = {
  solve: 'Hãy giải bài toán/đề bài này thật chi tiết theo đúng cấu trúc 5 phần.',
  simplify: 'Hãy giảng lại nội dung vừa rồi theo cách đơn giản, dễ hiểu hơn nhiều (như giảng cho học sinh mới học), dùng ví dụ và hình dung đời thường.',
  similar: 'Hãy tạo 3 bài tập tương tự (cùng dạng, độ khó tăng dần), kèm đáp số tham khảo ở cuối.',
  draw: 'Hãy vẽ hình minh họa trực quan cho bài này bằng khối mã geometry (chọn toạ độ chính xác theo đề), rồi giải thích ngắn gọn hình vẽ.'
};
document.querySelectorAll('#pills [data-act]').forEach((b) => b.addEventListener('click', () => {
  const instr = ACTIONS[b.dataset.act]; const typed = $('input').value.trim();
  const hasContext = !!curConv()?.messages.length || !!state.pendingImg;
  if (!typed && !state.pendingImg && !hasContext) { toast('Hãy nhập đề bài hoặc tải ảnh trước nhé!', 'info'); $('input').focus(); return; }
  $('input').value = typed ? `${instr}\n\n${typed}` : instr; autosize(); handleSend();
}));

function handleSend() {
  const text = $('input').value.trim();
  if (state.busy || (!text && !state.pendingImg)) return;
  $('input').value = ''; autosize();
  stopVoice();
  let conv = curConv();
  if (!conv) {
    conv = { id: uid(), title: (text || 'Bài từ ảnh').replace(/\s+/g, ' ').slice(0, 42), created: Date.now(), messages: [] };
    state.convs.unshift(conv); state.cur = conv.id;
  }
  conv.messages.push({ role: 'user', text, img: state.pendingImg || undefined });
  clearPendingImage(); persist(); renderHistory(); requestReply();
}
async function requestReply() {
  const conv = curConv(); if (!conv) return;
  state.busy = true; state.error = null; setSendDisabled(true); renderChat();
  try {
    const reply = await callGemini(conv.messages);
    conv.messages.push({ role: 'model', text: reply });
    persist();
  } catch (e) {
    state.error = e.message || 'Đã xảy ra lỗi.';
    toast(state.error, 'error', 6000);
  } finally { state.busy = false; setSendDisabled(false); renderChat(); renderHistory(); }
}
function retryLast() { const c = curConv(); if (c && c.messages.length && c.messages[c.messages.length - 1].role === 'user') requestReply(); }
function setSendDisabled(b) { $('sendBtn').disabled = b; }

/* =====================================================================
   8. INPUT: textarea, image (file / drop / paste), voice
   ===================================================================== */
function autosize() { const t = $('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 160) + 'px'; }
$('input').addEventListener('input', autosize);
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); handleSend(); } });

function fileToImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh.')); };
    img.src = url;
  });
}
function scaleToDataURL(img, max, q) {
  const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
async function setImageFile(file) {
  if (!file || !file.type.startsWith('image/')) return toast('Vui lòng chọn một tệp ảnh.', 'error');
  if (file.size > 20 * 1024 * 1024) return toast('Ảnh quá lớn (tối đa 20MB).', 'error');
  try {
    const img = await fileToImage(file);
    const full = scaleToDataURL(img, 1600, 0.88);     // gửi cho Gemini (Base64)
    const thumb = scaleToDataURL(img, 360, 0.7);      // lưu/hiển thị
    state.pendingImg = { mime: 'image/jpeg', data: full.split(',')[1], thumb };
    $('imgPreviewEl').src = thumb; $('imgPreview').classList.remove('hidden');
    toast('Đã thêm ảnh. Bấm gửi hoặc "Giải bài toán này".', 'success', 2500);
  } catch (e) { toast(e.message, 'error'); }
}
function clearPendingImage() { state.pendingImg = null; $('imgPreview').classList.add('hidden'); $('fileInput').value = ''; }
$('fileInput').addEventListener('change', (e) => setImageFile(e.target.files[0]));
document.addEventListener('paste', (e) => { const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith('image/')); if (f) { e.preventDefault(); setImageFile(f); } });
const dz = $('dropZone');
['dragenter', 'dragover'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.add('drop-active'); }));
['dragleave', 'drop'].forEach((ev) => dz.addEventListener(ev, (e) => { e.preventDefault(); dz.classList.remove('drop-active'); }));
dz.addEventListener('drop', (e) => setImageFile(e.dataTransfer.files[0]));

/* ---------- Voice (Web Speech API) ---------- */
function toggleVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return toast('Trình duyệt này chưa hỗ trợ nhập giọng nói. Hãy dùng Chrome/Edge/Safari.', 'error');
  if (state.listening) return stopVoice();
  const r = new SR(); r.lang = 'vi-VN'; r.interimResults = true; r.continuous = true;
  const base = $('input').value ? $('input').value + ' ' : '';
  r.onresult = (e) => { let s = ''; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; $('input').value = base + s; autosize(); };
  r.onerror = (e) => { toast(e.error === 'not-allowed' ? 'Bạn cần cho phép quyền micro.' : 'Lỗi giọng nói: ' + e.error, 'error'); stopVoice(); };
  r.onend = () => { state.listening = false; $('micBtn').classList.remove('listening'); $('micBtn').innerHTML = '<i class="fa-solid fa-microphone"></i>'; };
  try { r.start(); state.recog = r; state.listening = true; $('micBtn').classList.add('listening'); $('micBtn').innerHTML = '<i class="fa-solid fa-microphone-lines fa-beat"></i>'; toast('Đang nghe… hãy đọc đề bài', 'info', 2000); }
  catch (e) { toast('Không thể bật micro.', 'error'); }
}
function stopVoice() { try { state.recog && state.recog.stop(); } catch {} state.listening = false; }

/* =====================================================================
   9. SETTINGS MODAL
   ===================================================================== */
let draftModel = getModel();
function openSettings() { draftModel = getModel(); paintModelCards(); $('settingsModal').classList.remove('hidden'); $('settingsModal').classList.add('flex'); }
function closeSettings() { $('settingsModal').classList.add('hidden'); $('settingsModal').classList.remove('flex'); }
function paintModelCards() {
  document.querySelectorAll('.model-card').forEach((b) => {
    const on = b.dataset.model === draftModel;
    b.style.borderColor = on ? '#a855f7' : 'var(--border)'; b.style.boxShadow = on ? '0 0 0 2px rgba(168,85,247,.45), 0 0 20px rgba(168,85,247,.3)' : 'none';
  });
}
document.querySelectorAll('.model-card').forEach((b) => b.addEventListener('click', () => { draftModel = b.dataset.model; paintModelCards(); }));
function saveSettings() {
  lsSet(LS.model, draftModel); updateModelLabel(); closeSettings();
  toast('Đã lưu cài đặt', 'success', 2000);
}
function updateModelLabel() { $('modelLabel').textContent = MODELS[getModel()]; }
$('settingsModal').addEventListener('click', (e) => { if (e.target === $('settingsModal')) closeSettings(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSettings(); });
window.addEventListener('resize', (() => { let t; return () => { clearTimeout(t); t = setTimeout(() => renderAllGeometry(), 250); }; })());

/* Nút gợi ý nhanh dưới câu trả lời cuối */
document.addEventListener('click', (e) => {
  const q = e.target.closest('[data-quick]');
  if (!q || state.busy) return;
  $('input').value = ACTIONS[q.dataset.quick]; autosize(); handleSend();
});

/* =====================================================================
   10. INIT
   ===================================================================== */
(function init() {
  if (window.marked) marked.setOptions({ gfm: true, breaks: true });
  loadHistory();
  applyTheme(lsGet(LS.theme, 'dark'));
  updateModelLabel(); renderHistory(); renderChat();
})();
</script>
